server:
  host: 0.0.0.0
  port: 18081
  ws_port: 18082
auth:
  client_keys:
    - change-me-client-key
  admin_keys:
    - change-me-admin-key
helius:
  rpc_base_url: https://mainnet.helius-rpc.com/
  ws_base_url: wss://mainnet.helius-rpc.com/
  rest_base_url: https://api.helius.xyz
  admin_base_url: https://admin-api.helius.xyz/v0
  keys:
    - id: main
      name: main-helius-key
      api_key: change-me-helius-api-key
      project_id: optional-project-id-for-usage
      enabled: true
routing:
  sticky_round_robin_limit: 3
  cooldown_seconds: 60
  request_timeout_seconds: 30
  max_body_bytes: 33554432
